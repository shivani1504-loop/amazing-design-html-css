<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Orbs Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            backdrop-filter: blur(10px);
        }

        .orb-1 {
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.15);
            top: 5%;
            left: 5%;
            box-shadow: inset -50px -50px 100px rgba(255, 255, 255, 0.2);
            animation: moveOrb1 15s infinite ease-in-out;
        }

        .orb-2 {
            width: 280px;
            height: 280px;
            background: rgba(255, 255, 255, 0.08);
            bottom: 5%;
            right: 8%;
            box-shadow: inset -50px -50px 150px rgba(255, 255, 255, 0.2);
            animation: moveOrb2 18s infinite ease-in-out;
        }

        .orb-3 {
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.12);
            top: 50%;
            right: 15%;
            box-shadow: inset -30px -30px 60px rgba(255, 255, 255, 0.2);
            animation: moveOrb3 12s infinite ease-in-out;
        }

        .orb-4 {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            bottom: 30%;
            left: 10%;
            box-shadow: inset -30px -30px 60px rgba(255, 255, 255, 0.2);
            animation: moveOrb4 10s infinite ease-in-out;
        }

        .orb-5 {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.08);
            top: 20%;
            left: 35%;
            box-shadow: inset -20px -20px 50px rgba(255, 255, 255, 0.2);
            animation: moveOrb5 14s infinite ease-in-out;
        }

        .orb-6 {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.12);
            top: 70%;
            left: 40%;
            box-shadow: inset -15px -15px 40px rgba(255, 255, 255, 0.2);
            animation: moveOrb6 11s infinite ease-in-out;
        }

        .orb-7 {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.07);
            top: 15%;
            right: 30%;
            animation: moveOrb7 16s infinite ease-in-out;
        }

        .orb-8 {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.15);
            bottom: 20%;
            right: 40%;
            animation: moveOrb8 9s infinite ease-in-out;
        }

        .orbs-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .mini-orb {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);

            box-shadow:
                0 0 10px rgba(255, 255, 255, 0.25),
                inset -10px -10px 20px rgba(255, 255, 255, 0.15);

            animation: miniOrbFloat linear infinite;
        }

        @keyframes miniOrbFloat {
            0% {
                transform: translate(0, 110vh);
                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            50% {
                transform: translate(80px, 50vh);
            }

            100% {
                transform: translate(-80px, -20vh);
                opacity: 0;
            }
        }

        @keyframes moveOrb1 {

            0%,
            100% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(60px, -50px);
            }

            50% {
                transform: translate(-40px, -80px);
            }

            75% {
                transform: translate(30px, 40px);
            }
        }

        @keyframes moveOrb2 {

            0%,
            100% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-80px, 60px);
            }

            50% {
                transform: translate(60px, 40px);
            }

            75% {
                transform: translate(-40px, -60px);
            }
        }

        @keyframes moveOrb3 {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-80px, 80px);
            }
        }

        @keyframes moveOrb4 {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(70px, -60px);
            }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        h1 {
            color: white;
            font-size: 4rem;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            animation: slideDown 0.8s ease-out;
        }

        p {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.2rem;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            p {
                font-size: 1rem;
            }

            .orb-1 {
                width: 120px;
                height: 120px;
            }

            .orb-2 {
                width: 180px;
                height: 180px;
            }

            .orb-3 {
                width: 90px;
                height: 90px;
            }

            .orb-4 {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>

<body>
    <!-- Floating Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>
    <div class="orb orb-6"></div>
    <div class="orb orb-7"></div>
    <div class="orb orb-8"></div>
    <div class="orbs-container"></div>

    <!-- Text Content -->
    <script>
        const container = document.querySelector(".orbs-container");

        for (let i = 0; i < 40; i++) {

            const orb = document.createElement("div");

            orb.className = "mini-orb";

            const size = Math.random() * 25 + 5;

            orb.style.width = `${size}px`;
            orb.style.height = `${size}px`;

            orb.style.left = `${Math.random() * 100}%`;

            orb.style.animationDuration =
                `${Math.random() * 15 + 8}s`;

            orb.style.animationDelay =
                `${Math.random() * 10}s`;

            container.appendChild(orb);
        }
    </script>
</body>

</html>
