<section>

<div class="card" id="card">

<div class="layer orange">

<div class="left">

<!-- <i class="bi bi-person-heart"></i> -->

</div>

A

</div>

Ishvara (God)

</p>

</div>

</div>

<!-- BOX 2 -->

<div class="layer green">

<div class="left">

<p>

Jiva (Soul)

</p>

</div>

<div class="center">

B

</div>

<div class="right">

<!-- <i class="bi bi-person-hearts"></i> -->

</div>

</div>

<div class="layer cream">

<div class="left">

</div>

<div class="center">

C

</div>

<div class="right">

<h2>Support</h2>

<p>

Prakriti (Nature)

</p>

</div>

</div>

<!-- BOX 4 -->

<div class="layer gray">

<div class="left">

<p>

Karma (Action)

</p>

</div>

<div class="center">

D

</div>

<div class="right">

<!-- <i class="fa-solid fa-download"></i> -->

</div>
