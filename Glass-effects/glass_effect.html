<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Glass Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url("https://i.pinimg.com/736x/df/dc/28/dfdc287fd5c694b1a622c8773f03fcc0.jpg");
            
            background-size: cover;
            background-position: center;
            filter: blur(5px);
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .glass-box {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 15px;
            padding: 40px 60px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            background-image: url("https://i.pinimg.com/736x/76/49/e0/7649e048cbdb05356ff3281b1ba5744f.jpg");

            background-size: cover;
            background-position: center;
            transition: all 0.3s ease;
            cursor: pointer;
            min-width: 300px;
        }

        .glass-box:hover {
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.2);
            background-image: url("https://i.pinimg.com/1200x/ae/80/32/ae80328f14d3f517b0cfefc2ed96ece1.jpg");
            background-size: cover;
            background-position: center;
            transform: translateY(-5px);
        }

        .glass-box h1 {
            color: white;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
        }

        .glass-box p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            margin-bottom: 0;
            font-weight: 300;
        }

        @media (max-width: 600px) {
            .glass-box {
                padding: 30px 40px;
            }

            .glass-box h1 {
                font-size: 32px;
            }

            .glass-box p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="background"></div>
    <div class="container">
        <div class="glass-box">
            <h1>Glass Effect</h1>
            <p>Simple Glassmorphism Design</p>
        </div>
    </div>

    <script>
        // Hover animation with parallax effect
        const glassBox = document.querySelector('.glass-box');

        glassBox.addEventListener('mousemove', (e) => {
            const rect = glassBox.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const rotateX = (y - rect.height / 2) / 10;
            const rotateY = (x - rect.width / 2) / 10;

            glassBox.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        glassBox.addEventListener('mouseleave', () => {
            glassBox.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
        });
    </script>
</body>

</html>
