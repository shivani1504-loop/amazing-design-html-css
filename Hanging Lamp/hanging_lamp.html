<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanging Lamp On/Off Toggle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f1e3c 0%, #1a3a52 50%, #0d2b3f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .lamp-wrapper {
            position: relative;
            width: 200px;
            height: 300px;
            margin-top: -50px;
        }

        /* Rope/Chain */
        .rope {
            position: absolute;
            width: 2px;
            height: 120px;
            background: linear-gradient(to bottom, #8b7355 0%, #6b5345 100%);
            left: 50%;
            transform: translateX(-1px);
            top: -120px;
            box-shadow: 1px 0 3px rgba(0, 0, 0, 0.5);
        }

        .rope::before,
        .rope::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 8px;
            background: repeating-linear-gradient(
                90deg,
                #5a4a3a 0px,
                #5a4a3a 4px,
                transparent 4px,
                transparent 8px
            );
            left: -1px;
        }

        .rope::before {
            top: 0;
            background: radial-gradient(circle at center, #a0826d, #7a6a5d);
        }

        /* Lamp Dome */
        .lamp-dome {
            position: absolute;
            width: 160px;
            height: 95px;
            background: radial-gradient(ellipse at 30% 30%, #3a3a3a, #1a1a1a);
            border-radius: 50% 50% 15% 15%;
            left: 20px;
            top: 0;
            box-shadow: 
                inset -5px -8px 15px rgba(0, 0, 0, 0.8),
                inset -2px -2px 8px rgba(255, 200, 87, 0.1),
                0 10px 25px rgba(0, 0, 0, 0.6);
            transition: all 0.4s ease;
            z-index: 10;
        }

        .lamp-dome.on {
            box-shadow: 
                inset -5px -8px 15px rgba(0, 0, 0, 0.8),
                inset -2px -2px 8px rgba(255, 200, 87, 0.3),
                0 10px 25px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(255, 200, 87, 0.4),
                0 0 70px rgba(255, 200, 87, 0.2);
            background: radial-gradient(ellipse at 30% 30%, #4a4a3a, #2a2a1a);
        }

        /* Ambient Light Effect */
        .ambient-light {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 87, 0.15), transparent);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 1;
        }

        .ambient-light.on {
            opacity: 1;
        }

        /* Control Panel */
        .control-panel {
            position: absolute;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .toggle-switch {
            position: relative;
            width: 80px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 22px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            padding: 4px;
        }

        .toggle-switch:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .toggle-switch.on {
            background: rgba(255, 200, 87, 0.2);
            border-color: rgba(255, 200, 87, 0.5);
        }

        .toggle-circle {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .toggle-switch.on .toggle-circle {
            transform: translateX(36px);
            background: rgba(255, 200, 87, 0.8);
        }

        /* Status Text */
        .status-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .status-text.on {
            color: rgba(255, 200, 87, 0.9);
            text-shadow: 0 0 10px rgba(255, 200, 87, 0.3);
        }

        /* Info Text */
        .info-text {
            position: absolute;
            top: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="ambient-light"></div>
        
        <div class="lamp-wrapper">
            <div class="rope"></div>
            <div class="lamp-dome"></div>
        </div>

        <div class="control-panel">
            <div class="toggle-switch" id="toggleSwitch">
                <div class="toggle-circle">
                    <span id="switchIcon">○</span>
                </div>
            </div>
            <div class="status-text" id="statusText">OFF</div>
        </div>
    </div>

    <script>
        const toggleSwitch = document.getElementById('toggleSwitch');
        const lampDome = document.querySelector('.lamp-dome');
        const ambientLight = document.querySelector('.ambient-light');
        const statusText = document.getElementById('statusText');
        const switchIcon = document.getElementById('switchIcon');
        
        let isOn = false;

        // Toggle lamp on/off
        toggleSwitch.addEventListener('click', () => {
            isOn = !isOn;
            updateLampState();
        });

        // Update lamp visual state
        function updateLampState() {
            if (isOn) {
                toggleSwitch.classList.add('on');
                lampDome.classList.add('on');
                ambientLight.classList.add('on');
                statusText.textContent = 'ON';
                statusText.classList.add('on');
                switchIcon.textContent = '●';
            } else {
                toggleSwitch.classList.remove('on');
                lampDome.classList.remove('on');
                ambientLight.classList.remove('on');
                statusText.textContent = 'OFF';
                statusText.classList.remove('on');
                switchIcon.textContent = '○';
            }
        }

        // Keyboard support (Space bar to toggle)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleSwitch.click();
            }
        });
    </script>
</body>
</html>
