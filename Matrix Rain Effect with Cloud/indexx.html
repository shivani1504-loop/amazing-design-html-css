<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cute Dreamy Matrix Cloud UI</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Dynamic Cursor Glow Follower -->
  <div class="light-follower" id="light"></div>

  <!-- Background Animated Clouds & Stars -->
  <div class="bg-stars" id="starsContainer"></div>
  <div class="bg-cloud bg-cloud-1"></div>
  <div class="bg-cloud bg-cloud-2"></div>

  <!-- Main Animated Card Wrapper -->
  <main class="card-container">
    <div class="glow-border"></div>
    
    <!-- Top Header & Pill Badge -->
    <div class="card-header">
      <span class="badge"><span class="pulse-dot"></span> Matrix Cloud V2</span>
    </div>

    <!-- Multi-Cloud Stage -->
    <div class="cloud-wrapper">
      <!-- Side Mini-Cloud Left -->
      <!-- <div class="mini-cloud left-cloud"></div> -->

      <!-- Main Central Fluffy Cloud -->
      <div class="cloud" id="mainCloud">
        <div class="cloud-body"></div>
        <h2>✦ MAGIC MATRIX ✦</h2>
      </div>

      <!-- Side Mini-Cloud Right -->
      <!-- <div class="mini-cloud right-cloud"></div> -->
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
