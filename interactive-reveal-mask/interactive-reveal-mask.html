<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Reveal Mask | HTML CSS JavaScript</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a1a 50%, #0a0a1a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        .reveal-card {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1.5;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 255, 255, 0.2), 0 0 40px rgba(255, 0, 255, 0.15);
            animation: cardGlow 3s ease-in-out infinite;
        }

        @keyframes cardGlow {
            0%, 100% {
                box-shadow: 0 20px 60px rgba(0, 255, 255, 0.2), 0 0 40px rgba(255, 0, 128, 0.15);
            }
            50% {
                box-shadow: 0 20px 80px rgba(0, 255, 255, 0.3), 0 0 60px rgba(255, 0, 128, 0.25);
            }
        }

        .gradient-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff006e 0%, #fb5607 25%, #ffbe0b 50%, #8338ec 75%, #3a86ff 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            z-index: 1;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .content-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            text-align: center;
            padding: 40px;
            gap: 20px;
        }

        .tag {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            color: #00ffff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: tagPulse 2s ease-in-out infinite;
        }

        @keyframes tagPulse {
            0%, 100% {
                text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            }
            50% {
                text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            }
        }

        .heading {
            font-size: clamp(36px, 8vw, 72px);
            font-weight: 900;
            color: #000000;
            text-shadow: 
                2px 2px 0 rgba(54, 54, 54, 0.3),
                4px 4px 0 rgba(255, 255, 255, 0.2),
                6px 6px 20px rgba(0, 0, 0, 0.4);
            letter-spacing: -1px;
            line-height: 1.1;
            animation: textGlow 2s ease-in-out infinite;
        }

        @keyframes textGlow {
            0%, 100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.1);
            }
        }

        .hint-text {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: hintFade 1.5s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes hintFade {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        #maskCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            z-index: 3;
        }

        /* Particles background effect */
        .particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.8), rgba(0, 255, 255, 0));
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .reveal-card {
                max-width: 100%;
                border-radius: 20px;
            }

            .content-wrapper {
                padding: 30px 20px;
                gap: 15px;
            }

            .heading {
                font-size: clamp(24px, 6vw, 48px);
            }

            .tag {
                font-size: 10px;
                padding: 6px 16px;
            }

            #maskCanvas {
                cursor: pointer;
            }
        }

        /* Loading animation */
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .content-wrapper {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="reveal-card">
            <div class="gradient-back"></div>
            <div class="content-wrapper">
                <div class="tag">🎮 SYSTEM ONLINE</div>
                <div class="heading">REVEAL<br>THE MATRIX</div>
            </div>
            <canvas id="maskCanvas"></canvas>
            <div class="hint-text">👉 SCRATCH TO REVEAL 👈</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('maskCanvas');
        const ctx = canvas.getContext('2d');
        const card = document.querySelector('.reveal-card');

        // Set canvas size to match container
        function resizeCanvas() {
            const rect = card.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            drawMask();
        }

        // Draw the mask layer
        function drawMask() {
            ctx.fillStyle = 'rgba(30, 30, 40, 0.95)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add gradient overlay
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, 'rgba(50, 50, 80, 0.7)');
            gradient.addColorStop(1, 'rgba(30, 30, 50, 0.7)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Scratch effect variables
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        const brushRadius = 40;

        // Handle mouse/touch input
        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = (e.clientX || e.touches[0].clientX) - rect.left;
            lastY = (e.clientY || e.touches[0].clientY) - rect.top;
        }

        function scratch(e) {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            // Clear destination-out mode for scratch effect
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = brushRadius * 2;

            // Draw line from last point to current point
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();

            // Add circular scratches
            ctx.beginPath();
            ctx.arc(x, y, brushRadius, 0, Math.PI * 2);
            ctx.fill();

            // Add glow effect while scratching
            createScratchParticles(x, y);

            lastX = x;
            lastY = y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        // Create particles on scratch
        function createScratchParticles(x, y) {
            for (let i = 0; i < 3; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = (Math.random() * 10 + 5) + 'px';
                particle.style.height = particle.style.width;
                card.appendChild(particle);

                const vx = (Math.random() - 0.5) * 8;
                const vy = (Math.random() - 0.5) * 8 - 2;
                let px = x;
                let py = y;
                let life = 1;

                const animate = () => {
                    px += vx;
                    py += vy;
                    life -= 0.02;

                    particle.style.left = px + 'px';
                    particle.style.top = py + 'px';
                    particle.style.opacity = life;

                    if (life > 0) {
                        requestAnimationFrame(animate);
                    } else {
                        particle.remove();
                    }
                };

                animate();
            }
        }

        // Event listeners
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', scratch);
        canvas.addEventListener('touchend', stopDrawing);

        // Handle window resize
        window.addEventListener('resize', resizeCanvas);

        // Initialize
        resizeCanvas();

        // Add some interactive effects
        document.addEventListener('mousemove', (e) => {
            if (!isDrawing) {
                const x = (e.clientX / window.innerWidth) * 100;
                const y = (e.clientY / window.innerHeight) * 100;
                card.style.boxShadow = `
                    0 20px 60px rgba(0, 255, 255, ${0.15 + (x / 200)}),
                    0 0 40px rgba(255, 0, 128, ${0.1 + (y / 200)})
                `;
            }
        });

        // Auto-scratch demo on load (optional)
        setTimeout(() => {
            console.log('Scratch effect ready! Use mouse or touch to reveal.');
        }, 100);
    </script>
</body>
</html>
