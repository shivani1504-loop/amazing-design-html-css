<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jabalpur Poster | Shivani Shrivastava</title>

    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Poppins:wght@200;300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <div class="noise"></div>
    <div class="cursor-glow"></div>
    <section class="poster">
        <!-- Left -->
        <div class="left-info">
            <h2>
                Friday
                <br>
                21 July
                <br>
                2026
            </h2>
            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <!-- Right -->

        <div class="right-info">
            <h3>
                Marble
                <br>
                Rocks
                <span>
                    JABALPUR
                </span>
            </h3>
        </div>
        <!-- Main Typography -->

        <section class="hero">

            <div class="letters">

                <div class="slice slice1">
                    <img src="assets/shivji.jpg" class="slice-image">
                    <span>J</span>
                </div>

                <div class="slice slice2">
                    <img src="assets/shivji.jpg" class="slice-image">
                    <span>A</span>
                </div>

                <div class="slice slice3">
                    <img src="assets/shivji.jpg" class="slice-image">
                    <span>B</span>
                </div>

                <div class="slice slice4">
                    <img src="assets/shivji.jpg" class="slice-image">
                    <span>A</span>
                </div>

                <div class="slice slice5">
                    <img src="assets/shivji.jpg" class="slice-image">
                    <span>L</span>
                </div>

                <div class="slice slice6">
                    <img src="assets/shivji.jpg" class="slice-image">
                    <span>P</span>
                </div>

                <div class="slice slice7">
                    <img src="assets/shivji.jpg" class="slice-image">
                    <span>U</span>
                </div>

                <div class="slice slice8">
                    <img src="assets/shivji.jpg" class="slice-image">
                    <span>R</span>
                </div>

            </div>


            <!-- River Background -->

            <div class="river-image">

            </div>

            <!-- Glow -->

            <div class="light"></div>

        </section>
    <!-- Footer -->
        <div class="footer">
            <p>
                Design by
            </p>
            <h2>
                Shivani Shrivastava
            </h2>
        </div>
        <!-- Floating Shapes -->
        <div class="shape s1"></div>
        <div class="shape s2"></div>
        <div class="shape s3"></div>
        <div class="shape s4"></div>
        <div class="shape s5"></div>
        <div class="shape s6"></div>
        <div class="shape s7"></div>
        <div class="shape s8"></div>
        <!-- Background Particles -->
        <div class="particles">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
    </section>

    <script src="js/script.js"></script>

</body>

</html>
