<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Kayak Sign Up</title>
    <style>
        /* CSS RESET & GENERAL STYLES */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            /* PAGE FULL BACKGROUND IMAGE (Card ke bahar) */
            background-image: url('https://i.pinimg.com/1200x/96/05/47/960547073d609a3c0d4aad8697b3a2ce.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Subtle dark overlay for contrast outside the card */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 0;
        }

        /* MAIN CONTAINER FOR THE ENTIRE UI */
        .page-container {
            width: 900px;
            height: 600px;
            display: flex;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            z-index: 1;
            /* Sits above body overlay */
        }

        /* 1. LEFT WHITE (FORM) SIDE */
        .left-side {
            flex: 0 0 38%;
            height: 100%;
            background-color: #ffffff;
            padding: 60px 40px 50px 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .left-side h1 {
            color: #1a3263;
            text-transform: uppercase;
            font-size: 36px;
            letter-spacing: 2px;
            margin-bottom: 50px;
            font-weight: 800;
        }

        /* FORM FIELD STYLES */
        .form-group {
            position: relative;
            margin-bottom: 25px;
            width: 100%;
        }

        .field-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            opacity: 0.6;
            color: #1a3263;
        }

        .form-group input {
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 30px;
            background-color: #bdf2ee;
            color: #1a3263;
            font-size: 16px;
            padding-left: 58px;
            padding-right: 20px;
        }

        .form-group input::placeholder {
            color: #1a3263;
            opacity: 0.7;
        }

        /* CHECKBOX AND TERMS */
        .terms-container {
            display: flex;
            align-items: center;
            margin-bottom: 35px;
            font-size: 13px;
            color: #1a3263;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            padding-left: 30px;
        }

        .checkbox-label input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            height: 20px;
            width: 20px;
            background-color: white;
            border: 2px solid #36dcd1;
            border-radius: 4px;
        }

        .checkbox-label input:checked~.checkmark {
            background-color: #36dcd1;
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .checkbox-label input:checked~.checkmark:after {
            display: block;
        }

        .terms-text a {
            color: #27b9b0;
            text-decoration: underline;
        }

        /* BUTTON STYLES */
        .submit-btn {
            width: 150px;
            height: 48px;
            background-color: #36dcd1;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 40px;
        }

        .submit-btn:hover {
            background-color: #29b4ab;
        }

        /* SOCIAL ICONS */
        .social-icons {
            display: flex;
            gap: 15px;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .social-icon:hover {
            transform: scale(1.1);
        }

        .social-icon.facebook {
            background-color: #3b5998;
        }

        .social-icon.twitter {
            background-color: #1da1f2;
        }

        .social-icon.google {
            background-color: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .social-icon svg {
            width: 18px;
            height: 18px;
        }

        .social-icon.facebook svg,
        .social-icon.twitter svg {
            fill: white;
        }

        /* TORN PAPER EDGE EFFECT */
        .torn-edge {
            position: absolute;
            left: calc(38% - 1px);
            top: 0;
            height: 100%;
            width: 65px;
            z-index: 3;
            pointer-events: none;
            /* Reality drop shadow for ripped paper edge */
            filter: drop-shadow(8px 0px 6px rgba(0, 0, 0, 0.35));
        }

        .torn-path {
            fill: #ffffff;
        }

        /* 2. RIGHT OCEAN SIDE */
        .right-side {
            flex: 1;
            height: 100%;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .ocean-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* OVERLAY TEXT */
        .right-side .overlay-text {
            position: absolute;
            bottom: 80px;
            right: 60px;
            text-align: right;
            color: #ffffff;
            z-index: 2;
            text-shadow: 0px 4px 12px rgba(0, 0, 0, 0.5);
        }

        .right-side .overlay-text h2 {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .right-side .overlay-text p {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div class="page-container">

        <!-- 1. LEFT SIDE (WHITE FORM) -->
        <div class="left-side">
            <h1>SIGN UP</h1>

            <form>
                <div class="form-group">
                    <svg class="field-icon" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M12 4a4 4 0 0 1 4 4 4 4 0 0 1-4 4 4 4 0 0 1-4-4 4 4 0 0 1 4-4m0 10c4.42 0 8 1.79 8 4v2H4v-2c0-2.21 3.58-4 8-4Z" />
                    </svg>
                    <input type="email" placeholder="e-mail" required>
                </div>

                <div class="form-group">
                    <svg class="field-icon" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M12 17a2 2 0 0 1-2-2c0-1.11.89-2 2-2a2 2 0 0 1 2 2c0 1.11-.89 2-2 2m6-9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10c0-1.11.89-2 2-2h1V6a5 5 0 0 1 5-5a5 5 0 0 1 5 5v2h1m-6-5a3 3 0 0 0-3 3v2h6V6a3 3 0 0 0-3-3Z" />
                    </svg>
                    <input type="password" placeholder="password" required>
                </div>

                <div class="terms-container">
                    <label class="checkbox-label">
                        <input type="checkbox" name="terms" required>
                        <span class="checkmark"></span>
                    </label>
                    <div class="terms-text">I agree all statements in <a href="#">terms of service.</a></div>
                </div>

                <button type="submit" class="submit-btn">SIGN UP</button>
            </form>

            <div class="social-icons">
                <button class="social-icon facebook" type="button">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M14 13.5h2.5l1-4H14v-2c0-1.03.58-1.5 1.5-1.5H18V2.12C17.07 2.06 16.2 2 15.2 2 12.18 2 10 3.89 10 7.22v2.28H7.5v4H10V22h4v-8.5Z" />
                    </svg>
                </button>
                <button class="social-icon google" type="button">
                    <svg viewBox="0 0 24 24">
                        <path fill="#4285f4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34a853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#fbbc05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" />
                        <path fill="#ea4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                </button>
                <button class="social-icon twitter" type="button">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M22.46 6c-.77.35-1.6.58-2.46.69.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98C8.28 9.09 5.11 7.38 3 4.79c-.37.63-.58 1.37-.58 2.15 0 1.49.75 2.81 1.91 3.56-.71 0-1.37-.2-1.95-.5v.03c0 2.08 1.48 3.82 3.44 4.21a4.22 4.22 0 0 1-1.93.07 4.28 4.28 0 0 0 4 2.98 8.521 8.521 0 0 1-5.33 1.84c-.34 0-.68-.02-1.02-.06C3.44 20.29 5.7 21 8.12 21 16 21 20.33 14.46 20.33 8.79c0-.19 0-.37-.01-.56.84-.6 1.56-1.36 2.14-2.23z" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- TORN PAPER SVG EDGE -->
        <div class="torn-edge">
            <svg viewBox="0 0 60 700" width="100%" height="100%" preserveAspectRatio="none">
                <path class="torn-path"
                    d="M0,0 L12,0 C28,15 10,35 32,55 C48,70 12,90 38,110 C58,125 22,150 42,170 C55,183 18,210 35,235 C52,260 15,280 40,305 C58,323 20,350 48,375 C62,388 18,415 36,440 C52,462 14,485 38,510 C58,530 22,555 45,580 C60,596 16,625 32,650 C42,666 20,685 10,700 L0,700 Z" />
            </svg>
        </div>

        <!-- 2. RIGHT SIDE (OCEAN BACKGROUND & TEXT) -->
        <div class="right-side">
            <img src="https://i.pinimg.com/1200x/96/05/47/960547073d609a3c0d4aad8697b3a2ce.jpg" alt="Kayak Ocean View" class="ocean-bg-img" />

            

            <div class="overlay-text">
                <h2>EXPLORE THE OCEAN</h2>
                <p>DISCOVER NEW ADVENTURES</p>
            </div>
        </div>

    </div>

</body>

</html>
