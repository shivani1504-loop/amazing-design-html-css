<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Modern GSAP Navbar</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

    <!-- GSAP -->
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>

    <!-- JS -->
    <script defer src="js/script.js"></script>

</head>

<body>

    <!-- Background -->
    <div class="bg-grid"></div>
    <div class="noise"></div>
    <div class="mouse-glow"></div>

    <!-- Animated Mesh -->
    <div class="mesh">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- ================= NAVBAR ================= -->

    <header>

        <div class="logo">
            <h3>@codeshri</h3>

            <!-- <h1>
                Modern Navbar
            </h1>

            <p>using GSAP</p> -->
        </div>

        <nav>

            <ul>

                <li class="active">
                    <button>Home</button>
                    <div class="liquid"></div>
                </li>

                <li>
                    <button>Shop</button>
                    <div class="liquid"></div>
                </li>

                <li>
                    <button>About</button>
                    <div class="liquid"></div>
                </li>

                <li>
                    <button>Contact</button>
                    <div class="liquid"></div>
                </li>

            </ul>

        </nav>

    </header>

 

    <section class="hero">

        <div class="glass-card">

           h1>Modern Navbar</h1>

        </div>

    </section>

</body>

</html>
