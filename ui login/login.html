<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyHub - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        customPurple: '#b19cd9',
                        deepPurple: '#7c5dfa',
                        softBg: '#f3eef8',
                        cardBg: '#ffffff',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e4d8f4 0%, #f7f5fb 100%);
            overflow-x: hidden;
        }
        /* Soft 3D Neumorphic Shadows */
        .neumorphic-card {
            box-shadow: 0 25px 50px -12px rgba(124, 93, 250, 0.25), 
                        0 0 0 1px rgba(255, 255, 255, 0.8) inset;
        }
        .neumorphic-input {
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.04), 
                        0 1px 2px 0 rgba(255, 255, 255, 0.5);
        }
        .neumorphic-btn {
            box-shadow: 0 10px 20px -5px rgba(124, 93, 250, 0.4);
            transition: all 0.3s ease;
        }
        .neumorphic-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(124, 93, 250, 0.6);
        }
        .social-btn {
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(124, 93, 250, 0.15);
        }
        /* Floating Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 5s ease-in-out infinite;
        }
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-slow {
            animation: pulse-slow 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative p-4">

    <!-- Background Decorative Elements (Clouds & Lighting) -->
    <div class="absolute top-10 left-10 opacity-70 animate-float hidden lg:block pointer-events-none">
        <div class="w-32 h-12 bg-white rounded-full shadow-md relative">
            <div class="absolute -top-6 left-6 w-14 h-14 bg-white rounded-full"></div>
            <div class="absolute -top-4 left-16 w-12 h-12 bg-white rounded-full"></div>
        </div>
    </div>
    <div class="absolute top-20 right-16 opacity-70 animate-float hidden lg:block pointer-events-none" style="animation-delay: 2s;">
        <div class="w-28 h-10 bg-white rounded-full shadow-md relative">
            <div class="absolute -top-5 left-5 w-12 h-12 bg-white rounded-full"></div>
        </div>
    </div>

    <!-- Main Container matching the 3D Layout -->
    <div class="flex flex-col lg:flex-row items-center justify-center max-w-5xl w-full gap-8 relative z-10">

        <!-- 3D Illustration / Character Section (Left Side) -->
        <div class="relative flex items-center justify-center w-full lg:w-1/2 animate-float">
            <!-- Glow background effect -->
            <div class="absolute w-72 h-72 bg-purple-300 rounded-full filter blur-3xl opacity-40 -z-10"></div>
            
            <!-- Simulated 3D Character & Elements Wrapper -->
            <div class="relative text-center flex flex-col items-center">
                <div class="relative bg-gradient-to-tr from-purple-200 to-purple-400 p-2 rounded-3xl shadow-xl border-4 border-white max-w-xs overflow-hidden">
                    <!-- Placeholder representing the 3D character graphic from the prompt -->
                    <div class="h-96 w-64 flex flex-col items-center justify-center text-white bg-cover bg-center rounded-2xl relative" style="background: linear-gradient(135deg, #c4b5fd 0%, #a78bfa 100%);">
                        <i class="fa-solid fa-music text-6xl mb-4 animate-bounce text-white drop-shadow-lg"></i>
                        <h3 class="font-bold text-xl drop-shadow-md">Feel The Beat</h3>
                        <p class="text-xs text-purple-100 mt-2 px-4 text-center">Immerse yourself in a world of endless music & vibes.</p>
                        <!-- Decorative floating stars -->
                        <i class="fa-solid fa-star text-yellow-200 absolute top-6 right-8 text-sm animate-pulse"></i>
                        <i class="fa-solid fa-star text-pink-200 absolute bottom-12 left-8 text-xs animate-ping"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Phone Card Form Container (Right Side) -->
        <div class="w-full lg:w-1/2 max-w-md bg-white rounded-[40px] p-8 sm:p-10 neumorphic-card relative">
            
            <!-- App Music Icon Badge at the Top -->
            <div class="flex justify-center -mt-16 mb-6">
                <div class="w-20 h-20 bg-gradient-to-tr from-purple-500 to-purple-400 rounded-2xl shadow-lg flex items-center justify-center text-white text-3xl animate-pulse-slow border-4 border-white">
                    <i class="fa-solid fa-music"></i>
                    <i class="fa-solid fa-star text-yellow-300 text-xs absolute top-2 right-2"></i>
                    <i class="fa-solid fa-star text-pink-200 text-[10px] absolute bottom-3 left-3"></i>
                </div>
            </div>

            <!-- Header Titles -->
            <div class="text-center mb-8">
                <h2 id="form-title" class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-tight">Welcome Back!</h2>
                <p id="form-subtitle" class="text-xs sm:text-sm text-gray-400 mt-1">Please login to continue</p>
            </div>

            <!-- Form Body -->
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-5">
                
                <!-- Username / Email Input -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <input type="text" id="email" required placeholder="Username / Email" 
                        class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-100 rounded-2xl text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:bg-white neumorphic-input transition-all">
                </div>

                <!-- Password Input -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" id="password" required placeholder="Password" 
                        class="w-full pl-11 pr-12 py-3.5 bg-gray-50 border border-gray-100 rounded-2xl text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:bg-white neumorphic-input transition-all">
                    <!-- Toggle Password Visibility -->
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-purple-600 transition-colors">
                        <i id="eye-icon" class="fa-solid fa-eye-slash"></i>
                    </button>
                </div>

                <!-- Forgot Password Link -->
                <div class="flex justify-end">
                    <a href="#" onclick="alert('Password reset instructions sent to your email!')" class="text-xs font-medium text-purple-600 hover:text-purple-800 transition-colors">Forgot Password?</a>
                </div>

                <!-- Submit / Login Button -->
                <button type="submit" id="submit-btn" class="w-full py-4 bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-semibold rounded-2xl neumorphic-btn text-sm tracking-wide">
                    Login
                </button>
            </form>

            <!-- Divider -->
            <div class="relative flex py-4 items-center">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-4 text-gray-400 text-xs">or continue with</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <!-- Social Media Login Icons -->
            <div class="flex justify-center gap-4 mt-2">
                <button onclick="socialLogin('Google')" class="w-12 h-12 rounded-full bg-white social-btn flex items-center justify-center border border-gray-100 text-red-500 text-lg">
                    <i class="fa-brands fa-google"></i>
                </button>
                <button onclick="socialLogin('Apple')" class="w-12 h-12 rounded-full bg-white social-btn flex items-center justify-center border border-gray-100 text-gray-800 text-lg">
                    <i class="fa-brands fa-apple"></i>
                </button>
                <button onclick="socialLogin('Facebook')" class="w-12 h-12 rounded-full bg-white social-btn flex items-center justify-center border border-gray-100 text-blue-600 text-lg">
                    <i class="fa-brands fa-facebook-f"></i>
                </button>
            </div>

            <!-- Switch to Sign Up / Login Footer -->
            <div class="text-center mt-6">
                <p id="switch-text" class="text-xs text-gray-500">
                    Don’t have an account? <span onclick="toggleMode()" class="text-purple-600 font-semibold cursor-pointer hover:underline">Sign Up</span>
                </p>
            </div>

        </div>
    </div>

    <!-- JavaScript Interactivity -->
    <script>
        let isLoginMode = true;

        // Toggle Password Visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            }
        }

        // Switch between Login and Sign Up views dynamically
        function toggleMode() {
            isLoginMode = !isLoginMode;
            const title = document.getElementById('form-title');
            const subtitle = document.getElementById('form-subtitle');
            const submitBtn = document.getElementById('submit-btn');
            const switchText = document.getElementById('switch-text');

            if (isLoginMode) {
                title.innerText = "Welcome Back!";
                subtitle.innerText = "Please login to continue";
                submitBtn.innerText = "Login";
                switchText.innerHTML = `Don’t have an account? <span onclick="toggleMode()" class="text-purple-600 font-semibold cursor-pointer hover:underline">Sign Up</span>`;
            } else {
                title.innerText = "Create Account";
                subtitle.innerText = "Join MelodyHub today";
                submitBtn.innerText = "Sign Up";
                switchText.innerHTML = `Already have an account? <span onclick="toggleMode()" class="text-purple-600 font-semibold cursor-pointer hover:underline">Login</span>`;
            }
        }

        // Form Submit Handler with interactive feedback
        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const action = isLoginMode ? "Logged in" : "Registered";
            alert(`Success! ${action} successfully as: ${email}`);
        }

        // Social Login Handler mockup
        function socialLogin(provider) {
            alert(`Redirecting to ${provider} Authentication...`);
        }
    </script>
</body>
</html>
